name: ctd-collector

services:
  source:
    build: ./source
    environment:
      SOURCE_DEFAULT_STATION: ST01
      SOURCE_DEFAULT_DATE: "2026-11-16"
      SOURCE_PACKAGE_BYTES: "524288"   # 512 KiB，演示续传足够快
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  collector-a:
    build: ./collector
    depends_on:
      source:
        condition: service_healthy
    environment:
      INSTANCE_ID: collector-a
      SOURCE_BASE_URL: http://source:8000
      COLLECTOR_DATA_DIR: /data
      HTTP_TIMEOUT: "30"
    ports:
      - "8001:8000"
    volumes:
      - collector-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  collector-b:
    build: ./collector
    depends_on:
      source:
        condition: service_healthy
    environment:
      INSTANCE_ID: collector-b
      SOURCE_BASE_URL: http://source:8000
      COLLECTOR_DATA_DIR: /data
      HTTP_TIMEOUT: "30"
    ports:
      - "8002:8000"
    volumes:
      - collector-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  collector-data:
